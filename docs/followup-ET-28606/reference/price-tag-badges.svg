<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" role="img" aria-label="The two benchmark badges: Apps (Hyperliquid, 35x revenue) and Chains (Solana, 38x adoption)">
  <rect width="560" height="320" fill="#0a0e17"/>
  <svg x="38" y="14" width="204" height="244" viewBox="-2 -2 204 244"><!-- Item 13, Apps badge. For Chains see price-tag-badge-chains.svg. Fonts: Archivo Black, IBM Plex Mono (fall back to the system fonts).
       On the page it is about 92 x 110 px: the word BENCHMARK on the ribbon is then about 9 px high. -->
  <defs>
    <path id="a-shield" d="M24 3Q100 30 176 3Q188 26 199 42C192 60 188 90 189 120C190 160 192 175 186 190C170 215 130 230 100 238C70 230 30 215 14 190C8 175 10 160 11 120C12 90 8 60 1 42Q12 26 24 3Z"/>
    <linearGradient id="a-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a7d99"/><stop offset=".12" stop-color="#00cfff"/><stop offset=".27" stop-color="#d4fff6"/>
      <stop offset=".42" stop-color="#00ff88"/><stop offset=".56" stop-color="#007f55"/><stop offset=".72" stop-color="#00ff88"/>
      <stop offset=".86" stop-color="#b8ffe9"/><stop offset="1" stop-color="#0a8f9f"/>
    </linearGradient>
    <linearGradient id="a-face" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9ffee"/><stop offset=".35" stop-color="#4af5a8"/><stop offset=".62" stop-color="#00c878"/><stop offset="1" stop-color="#00dd86"/>
    </linearGradient>
    <clipPath id="a-faceClip"><use href="#a-shield" transform="translate(100 122) scale(.905) translate(-100 -122)"/></clipPath>
    <clipPath id="a-logoClip"><circle cx="100" cy="100" r="24"/></clipPath>
  </defs>
  <use href="#a-shield" fill="url(#a-rim)"/>
  <use href="#a-shield" transform="translate(100 122) scale(.935) translate(-100 -122)" fill="#04332f"/>
  <use href="#a-shield" transform="translate(100 122) scale(.915) translate(-100 -122)" fill="url(#a-rim)" opacity=".55"/>
  <use href="#a-shield" transform="translate(100 122) scale(.905) translate(-100 -122)" fill="url(#a-face)"/>
  <g clip-path="url(#a-faceClip)"><path d="M0 0H120L40 240H0Z" fill="#fff" opacity=".12"/></g>

  <!-- the ribbon: says what it is -->
  <path d="M0 26H200L190 39L200 52H0L10 39Z" fill="#04271f" stroke="#00ff88" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="100" y="46" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="19" letter-spacing="2.4" fill="#00ff88">BENCHMARK</text>

  <!-- who -->
  <circle cx="100" cy="100" r="28" fill="#06382d" stroke="#04271f" stroke-width="3.5"/>
  <circle cx="100" cy="100" r="24" fill="#fff"/>
  <image href="data:image/webp;base64," x="76" y="76" width="48" height="48" clip-path="url(#a-logoClip)" preserveAspectRatio="xMidYMid slice"/>

  <!-- how much, and of what -->
  <text x="100" y="170" text-anchor="middle" font-family="Archivo Black, Arial Black, sans-serif" font-size="54" fill="#04271f" letter-spacing="-1">35<tspan font-size="34" dy="-3">×</tspan></text>
  <text x="100" y="196" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="17" letter-spacing="3" fill="#04271f">REVENUE</text>
</svg>
  <svg x="318" y="14" width="204" height="244" viewBox="-2 -2 204 244"><!-- Item 13, Chains badge: the same as price-tag-badge-apps.svg with Solana's logo, 38 and ADOPTION. -->
  <defs>
    <path id="c-shield" d="M24 3Q100 30 176 3Q188 26 199 42C192 60 188 90 189 120C190 160 192 175 186 190C170 215 130 230 100 238C70 230 30 215 14 190C8 175 10 160 11 120C12 90 8 60 1 42Q12 26 24 3Z"/>
    <linearGradient id="c-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a7d99"/><stop offset=".12" stop-color="#00cfff"/><stop offset=".27" stop-color="#d4fff6"/>
      <stop offset=".42" stop-color="#00ff88"/><stop offset=".56" stop-color="#007f55"/><stop offset=".72" stop-color="#00ff88"/>
      <stop offset=".86" stop-color="#b8ffe9"/><stop offset="1" stop-color="#0a8f9f"/>
    </linearGradient>
    <linearGradient id="c-face" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9ffee"/><stop offset=".35" stop-color="#4af5a8"/><stop offset=".62" stop-color="#00c878"/><stop offset="1" stop-color="#00dd86"/>
    </linearGradient>
    <clipPath id="c-faceClip"><use href="#c-shield" transform="translate(100 122) scale(.905) translate(-100 -122)"/></clipPath>
    <clipPath id="c-logoClip"><circle cx="100" cy="100" r="24"/></clipPath>
  </defs>
  <use href="#c-shield" fill="url(#c-rim)"/>
  <use href="#c-shield" transform="translate(100 122) scale(.935) translate(-100 -122)" fill="#04332f"/>
  <use href="#c-shield" transform="translate(100 122) scale(.915) translate(-100 -122)" fill="url(#c-rim)" opacity=".55"/>
  <use href="#c-shield" transform="translate(100 122) scale(.905) translate(-100 -122)" fill="url(#c-face)"/>
  <g clip-path="url(#c-faceClip)"><path d="M0 0H120L40 240H0Z" fill="#fff" opacity=".12"/></g>
  <path d="M0 26H200L190 39L200 52H0L10 39Z" fill="#04271f" stroke="#00ff88" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="100" y="46" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="19" letter-spacing="2.4" fill="#00ff88">BENCHMARK</text>
  <circle cx="100" cy="100" r="28" fill="#06382d" stroke="#04271f" stroke-width="3.5"/>
  <circle cx="100" cy="100" r="24" fill="#fff"/>
  <image href="data:image/webp;base64," x="76" y="76" width="48" height="48" clip-path="url(#c-logoClip)" preserveAspectRatio="xMidYMid slice"/>
  <text x="100" y="170" text-anchor="middle" font-family="Archivo Black, Arial Black, sans-serif" font-size="54" fill="#04271f" letter-spacing="-1">38<tspan font-size="34" dy="-3">×</tspan></text>
  <text x="100" y="196" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="17" letter-spacing="3" fill="#04271f">ADOPTION</text>
</svg>
  <g font-family="IBM Plex Mono, monospace" font-weight="700" font-size="12" fill="#9fb0c3" text-anchor="middle">
    <text x="140" y="290">APPS · HYPERLIQUID</text><text x="420" y="290">CHAINS · SOLANA</text>
  </g>
</svg>
