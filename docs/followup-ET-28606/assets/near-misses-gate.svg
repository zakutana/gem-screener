<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 150" width="112" height="150" role="img" aria-label="Gate to the picks">
  <!-- Item 5: the gate that replaces the green "Picks" box. The doorway pulses and the chevron runs into it; both stop for visitors who ask for less motion. -->
  <style>
    .door { animation: pulse 2.4s ease-in-out infinite; }
    .chev { animation: flow 1.6s linear infinite; opacity: 0; }
    @keyframes pulse { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
    @keyframes flow { 0% { opacity: 0; transform: translateX(8px) } 40% { opacity: 1 } 100% { opacity: 0; transform: translateX(-8px) } }
    @media (prefers-reduced-motion: reduce) { .door, .chev { animation: none } .door { opacity: 1 } .chev { opacity: .8 } }
  </style>
  <path d="M4 150V64A52 52 0 0 1 108 64V150" fill="rgba(0,255,136,.07)" stroke="#00ff88" stroke-width="3"/>
  <g class="door">
    <path d="M20 150V68A36 36 0 0 1 92 68V150Z" fill="rgba(0,255,136,.20)"/>
    <path d="M38 150V40M56 150V30M74 150V40" stroke="#00ff88" stroke-width="1.5" opacity=".35"/>
  </g>
  <path d="M56 2l10 10-10 14-10-14z" fill="#0a0e17" stroke="#00ff88" stroke-width="2"/>
  <path d="M50 12h12" stroke="#00ff88" stroke-width="1.5"/>
  <path d="M45 92l7 7 14-14" fill="none" stroke="#00ff88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(-4 -6) scale(1.05)"/>
  <text x="56" y="128" text-anchor="middle" fill="#00ff88" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="14" letter-spacing="1.5">PICKS</text>
  <path class="chev" d="M106 140l-6 -5 6 -5" fill="none" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
