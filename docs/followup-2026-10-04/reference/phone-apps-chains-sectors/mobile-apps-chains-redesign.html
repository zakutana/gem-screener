<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gem Screener Phone Layout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- the live page's tokens (cymetica.com/gem-screener/app, 2026-10-04) ---------- */
:root{
  --paper:#0a0e17; --surface:#0d1520; --surface-2:#111a28; --surface-sunk:#070b12;
  --ink:#E6EDF7; --ink-2:#A9B8CC; --muted:#6F8199; --text-heading:#F3F7FC;
  --rule:rgba(0,150,255,.15); --rule-soft:rgba(0,150,255,.08);
  --accent:#00cfff; --accent-soft:rgba(0,207,255,.14); --accent-ink:#7FE6FF;
  --good:#00ff88; --good-soft:rgba(0,255,136,.14); --gem:#00ff88;
  --bad:#ff4444; --bad-soft:rgba(255,68,68,.14);
  --warn:#3b82f6; --warn-soft:color-mix(in srgb,#3b82f6 16%,transparent);
  --focus:#00cfff; --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 36px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0;background:#05080e}
body{width:1500px;padding:18px 28px 24px;color:var(--ink);font:15px/1.48 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- mockup chrome ---------- */
.mk-h{display:flex;align-items:baseline;gap:16px;margin:0 0 12px}
.mk-h b{font:400 24px "Archivo Black",sans-serif;color:var(--text-heading)}
.mk-h span{font:500 12px "IBM Plex Mono",monospace;color:var(--muted)}
.mk-h .bp{margin-left:auto;color:var(--accent);font-size:12.5px}
.mk-sub{margin:-6px 0 12px;font:500 12px "IBM Plex Mono",monospace;color:var(--muted)}
.row{display:grid;grid-template-columns:repeat(4,312px);gap:26px;margin-bottom:16px}
.shot{margin:0;min-width:0}
.shot.wide{grid-column:span 2}
.shot figcaption{display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px;margin:0 0 6px;min-height:36px}
.tag{font:700 10px "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;border-radius:5px}
.tag.before{color:var(--ink-2);border:1px solid rgba(255,68,68,.6)}
.tag.after{color:#04121c;background:var(--accent)}
.tag.desk{color:#04121c;background:var(--good)}
.shot figcaption b{font:700 13.5px "IBM Plex Sans",sans-serif;color:var(--text-heading)}
.shot .cap{flex-basis:100%;font:500 11px "IBM Plex Mono",monospace;color:var(--ink-2)}
.ph{width:390px;height:653px;zoom:.8;position:relative;overflow:hidden;border:1.5px solid rgba(0,150,255,.3);border-radius:24px;background:var(--paper)}
.note{position:absolute;z-index:50;font:600 12px/1.35 "IBM Plex Mono",monospace;color:#fff;background:rgba(10,14,23,.94);border:1.5px solid var(--bad);border-radius:8px;padding:6px 9px}
.note.ok{border-color:var(--accent)}
.brk{position:absolute;z-index:49;border:2px solid var(--bad);border-left:0;border-radius:0 6px 6px 0;width:10px}
.desk-img{display:block;width:100%;border:1.5px solid rgba(0,150,255,.3);border-radius:12px}
.desk-cap{margin-top:8px;font:500 11.5px "IBM Plex Mono",monospace;color:var(--ink-2)}

/* ---------- shared live components ---------- */
.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.ico-fb{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none;font:700 9.5px "IBM Plex Mono",monospace;color:var(--accent-ink);background:#1b2738;border:1px solid rgba(0,150,255,.2)}
.namecell{display:flex;align-items:center;gap:10px;min-width:0}
.namecell .txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.namecell .nmrow{display:flex;align-items:center;gap:5px;min-width:0}
.namecell .nm{font-weight:600;color:var(--ink);font-size:14px}
.namecell .sym{font:11px "IBM Plex Mono",monospace;color:var(--muted)}
.nmicon{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;border-radius:50%;color:var(--muted)}
.dmeter{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;color:var(--muted)}
.dmeter .dnum{font:700 16px "IBM Plex Mono",monospace;min-width:14px;text-align:right}
.dmeter .dsegs{display:inline-flex;gap:2px}
.dmeter .dsegs i{display:block;width:8px;height:16px;border-radius:2px;border:1px solid transparent;background:rgba(111,129,153,.16)}
.dmeter .dsegs i.on.zg{background:var(--good)} .dmeter .dsegs i.on.zw{background:var(--warn)} .dmeter .dsegs i.on.zb{background:var(--bad)}
.dmeter .dsegs i.dash{background:transparent;border:1px dashed var(--warn)} .dmeter .dsegs i.dash.zb{border-color:var(--bad)}
.dmeter.d-warn{color:var(--warn)} .dmeter.d-bad{color:var(--bad)} .dmeter.d-good{color:var(--good)}
.upside{display:inline-block;font:13px "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;padding:3px 9px;border-radius:5px;border:1px solid transparent;min-width:56px;text-align:center}
.t5{background:var(--gem);color:var(--surface-sunk);font-weight:700;border-color:var(--gem)}
.t4{background:color-mix(in srgb,var(--gem) 26%,transparent);color:var(--gem);font-weight:700;border-color:color-mix(in srgb,var(--gem) 55%,transparent)}
.phase{font:600 10px "IBM Plex Mono",monospace;letter-spacing:.05em;padding:2px 7px;border-radius:99px;white-space:nowrap;text-transform:uppercase;border:1px solid transparent}
.p-ign{background:var(--warn);color:#0a0e17;border-color:var(--warn);font-weight:700}
.p-acc{background:var(--good);color:#0a0e17;border-color:var(--good);font-weight:700}
.p-slow,.p-flat{background:var(--warn-soft);color:#8fb4ff;border-color:var(--warn)}
.p-decl{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.p-new{background:transparent;color:var(--muted);border-color:var(--rule)}
.hsnum{font:700 12.5px "IBM Plex Mono",monospace;color:var(--ink)}
.catchip{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:99px;white-space:nowrap}
.themechip{font-size:10.5px;line-height:1.5;padding:0 7px;border-radius:99px;background:transparent;white-space:nowrap;border:1px solid var(--accent);color:var(--accent)}
.sharebadge{font:11px "IBM Plex Mono",monospace;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.sharebadge .sbar{width:26px;height:4px;border-radius:2px;background:var(--surface-sunk);overflow:hidden}
.sharebadge .sbar i{display:block;height:100%;background:var(--muted)}
.gval{font-weight:600} .gval.pos{color:var(--good)} .gval.neg{color:var(--bad)} .gval.flat{color:var(--muted)}
.sila.down{color:var(--bad);font:600 13px "IBM Plex Mono",monospace}
.stpill{display:inline-flex;align-items:center;gap:4px;font:700 10.5px "IBM Plex Mono",monospace;letter-spacing:.06em;padding:2px 8px;border-radius:99px;text-transform:uppercase;border:1px solid currentColor;white-space:nowrap}
.stpill.st-emerging{color:var(--accent);background:var(--accent-soft)} .stpill.st-hot{color:var(--good);background:var(--good-soft)}
.stpill.st-fading{color:#6ea2ff;background:var(--warn-soft)} .stpill.st-falling{color:var(--bad);background:var(--bad-soft)}
.tagic{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;border-radius:50%;background:var(--good-soft);color:var(--good)}
.tagic.bad{background:var(--bad-soft);color:var(--bad)}
.gastag{font:600 10px "IBM Plex Sans",sans-serif;color:#8fb4ff;border:1px solid var(--warn);border-radius:99px;padding:0 6px;white-space:nowrap}

/* ---------- live phone header + controls (BEFORE recreation) ---------- */
.logo{display:flex;align-items:center;gap:9px}
.logo .gem{flex:none}
.logo .wm{display:flex;flex-direction:column}
.logo .wm b{font:400 37px/1 "Archivo Black",sans-serif;color:#fff;letter-spacing:.005em}
.logo .wm span{display:flex;justify-content:space-between;font:700 9.5px "IBM Plex Sans",sans-serif;color:var(--good);margin-top:2px}
.logo .wm span i{font-style:normal;color:var(--muted)} .logo .wm span i em{font-style:normal;color:var(--accent)}
.b-top{background:var(--surface);border-bottom:1px solid var(--rule);padding:12px 16px 0}
.meta{font:12px/1.35 "IBM Plex Mono",monospace;color:var(--ink-2);margin-top:6px}
.meta b{color:var(--ink);font-weight:600} .meta .live{color:var(--good)} .meta .stale{color:#6ea2ff}
.tabs{display:flex;align-items:center;margin-top:4px}
.tabs .t{font:600 13px "IBM Plex Sans",sans-serif;color:var(--muted);padding:7px 4px 9px;margin-right:12px;border-bottom:2px solid transparent}
.tabs .t.on{color:var(--ink);border-bottom-color:var(--accent)}
.legendbtn{margin-left:auto;font:600 11.5px "IBM Plex Mono",monospace;color:var(--accent);background:var(--surface-sunk);border:1px solid var(--rule);border-radius:6px;padding:5px 9px}
.b-ctl{position:relative;background:var(--surface-2);border-bottom:1px solid var(--rule);padding:12px 16px;height:137px}
.switch{display:inline-flex;background:var(--surface-sunk);border-radius:6px;padding:2px;gap:2px}
.switch span{font:600 11.5px "IBM Plex Mono",monospace;color:var(--muted);padding:5px 10px;border-radius:5px;white-space:nowrap}
.switch span.on{background:var(--surface);color:var(--accent)}
.b-row2{display:flex;gap:8px;margin-top:8px;align-items:center}
.b-search{width:193px;height:32px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);font:13px "IBM Plex Sans",sans-serif;color:var(--muted);padding:6px 10px 0 30px;position:relative;white-space:nowrap;overflow:hidden}
.b-search svg,.a-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.6}
.count{font:11px "IBM Plex Mono",monospace;color:var(--muted);background:var(--surface-sunk);padding:5px 10px;border-radius:5px}
.count b{color:var(--ink)}
.floor{display:flex;align-items:center;gap:7px;margin-top:9px}
.floor label{font:600 10px/1.25 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);width:90px}
.segs{position:relative;display:flex;gap:3px;width:120px}
.segs i{flex:1;height:8px;border-radius:4px;background:#0f5a43;opacity:.6}
.segs i.on{background:var(--accent);opacity:1}
.segs .knob{position:absolute;top:-3px;width:13px;height:13px;transform:rotate(45deg);border-radius:3px;border:2px solid #04332f;background:linear-gradient(135deg,#d4fff6,#00ff88 55%,#00a86b);box-shadow:0 0 10px rgba(0,255,136,.55)}
.fval{min-width:62px;padding:4px 9px;border:1.5px solid #00e0c8;border-radius:8px;background:var(--surface);color:#fff;font:700 12.5px "IBM Plex Mono",monospace;text-align:center}
.bbadge{position:absolute;right:16px;bottom:14px;width:56px;height:48px}
.lb-eye{font:10.5px "IBM Plex Mono",monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.lb-title{font:700 21px/1.1 "IBM Plex Sans",sans-serif;letter-spacing:-.02em;margin:6px 0 14px}
.herochart{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:20px 22px 16px}
.hc-sub{font:12px "IBM Plex Mono",monospace;color:var(--muted);margin:0 0 12px}
.b-tbl{border:1px solid var(--rule);border-radius:8px;background:var(--surface);overflow:hidden;margin:0 16px}
.b-tr{display:flex;align-items:center;height:81px;border-bottom:1px solid var(--rule-soft);background:color-mix(in srgb,var(--gem) 11%,transparent);white-space:nowrap}
.b-tr .namecell{width:196px;flex:none}
.b-tr .namecell .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:150px}
.b-tr .dmeter{margin-left:6px}
.b-rank{width:42px;padding-left:8px;display:flex;flex-direction:column;align-items:center;gap:6px;font:12.5px "IBM Plex Mono",monospace;color:var(--muted)}
.pk18{width:18px;height:18px;border:1px solid rgba(0,150,255,.35);border-radius:4px;color:var(--accent);font:700 12px/16px sans-serif;text-align:center}
.scrollbar{position:absolute;height:5px;border-radius:3px;background:rgba(169,184,204,.45)}

/* ---------- AFTER: the phone layout (on the page: inside @media (max-width:640px)) ---------- */
.a-brand{background:var(--surface);padding:10px 16px 6px}
.a-brand .logo .wm b{font-size:25px}
.a-brand .logo .wm span{font-size:7px}
.a-brand .meta{font-size:11px;margin-top:5px}
.a-tabs{display:flex;align-items:stretch;background:var(--surface);border-bottom:1px solid var(--rule);padding:0 10px 0 9px;height:44px}
.a-tabs .t{display:flex;align-items:center;font:600 13.5px "IBM Plex Sans",sans-serif;color:var(--muted);padding:0 7px;margin-right:2px;border-bottom:2px solid transparent}
.a-tabs .t.on{color:var(--ink);border-bottom-color:var(--accent)}
.a-tabs .legendbtn{align-self:center;height:34px;display:flex;align-items:center;font-size:12px;padding:0 11px}
.a-ctl{display:grid;grid-template-columns:auto minmax(0,1fr) 44px;gap:8px;padding:6px 16px;background:var(--surface-2);border-bottom:1px solid var(--rule)}
.m-mode{display:flex;align-items:center;gap:8px;height:44px;padding:0 10px 0 12px;border-radius:8px;border:1px solid rgba(0,207,255,.45);background:var(--surface-sunk);color:var(--accent);font:600 16px "IBM Plex Sans",sans-serif;white-space:nowrap}
.a-search{position:relative;height:44px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);font:16px/42px "IBM Plex Sans",sans-serif;color:var(--muted);padding-left:34px;overflow:hidden;white-space:nowrap}
.m-filt{position:relative;width:44px;height:44px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);display:grid;place-items:center}
.m-filt .dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:#04121c;font:700 10px/16px "IBM Plex Mono",monospace;text-align:center}
.a-body{padding:8px 16px 0}
.m-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.m-sum{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;height:44px;padding:0 4px;border-radius:8px;text-align:left}
.m-sum b{font:700 14px "IBM Plex Sans",sans-serif;color:var(--ink)} .m-sum b .u{color:var(--accent);font-weight:600}
.m-sum span{font:500 11.5px "IBM Plex Mono",monospace;color:var(--ink-2);white-space:nowrap}
.m-disc{display:flex;align-items:center;gap:7px;height:44px;padding:0 12px;border-radius:22px;border:1px solid rgba(0,207,255,.45);background:var(--surface);color:var(--accent);font:600 13px "IBM Plex Sans",sans-serif;white-space:nowrap}
.m-disc[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent)}
.m-disc .chev{transition:transform .15s} .m-disc[aria-expanded="true"] .chev{transform:rotate(180deg)}
.mcards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mcard{display:grid;grid-template-columns:44px minmax(0,1fr) auto;grid-template-areas:"pick id up" "pick meter up" "stats stats more" "det det det";
  column-gap:6px;row-gap:2px;padding:8px 6px 6px 2px;background:var(--surface);border:1px solid var(--rule-soft);border-radius:12px}
.mcard[data-tier="5"]{background:color-mix(in srgb,var(--gem) 9%,var(--surface))}
.mcard[data-tier="4"]{background:color-mix(in srgb,var(--gem) 5%,var(--surface))}
.mcard.open{border-color:rgba(0,207,255,.55)}
.mc-pick{grid-area:pick;display:flex;flex-direction:column;align-items:center}
.mcard .pickbtn{position:relative;isolation:isolate;width:44px;height:44px;border:0;background:none;color:var(--accent);font:700 15px/44px "IBM Plex Sans",sans-serif;padding:0;text-align:center}
.mcard .pickbtn::before{content:"";position:absolute;inset:9px;border:1.5px solid rgba(0,150,255,.5);border-radius:6px;z-index:-1}
.mcard .pickbtn.on{color:var(--paper)} .mcard .pickbtn.on::before{background:var(--gem);border-color:var(--gem)}
.mc-rank{font:600 11px "IBM Plex Mono",monospace;color:var(--muted);margin-top:-6px}
.mc-id{grid-area:id;min-width:0;padding-top:3px}
.mcard .namecell{gap:9px} .mcard .namecell .nm{font-size:15.5px;line-height:1.2;white-space:normal}
.mc-meter{grid-area:meter;display:flex;align-items:center;gap:7px;padding-left:39px}
.mcard .dmeter .dnum{font-size:14px} .mcard .dmeter .dsegs i{width:9px;height:13px}
.mc-k{font:500 9.5px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mc-up{grid-area:up;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:3px;padding-right:4px}
.mcard .upside{font-size:18px;font-weight:700;padding:3px 9px;min-width:0}
.mc-stats{grid-area:stats;display:grid;grid-template-columns:.9fr .9fr 1.3fr;column-gap:8px;margin:6px 0 0 8px;border-top:1px solid var(--rule-soft);padding-top:6px}
.mc-s{display:flex;flex-direction:column;gap:1px;min-width:0}
.mc-v{font:700 15px "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:5px;min-height:22px}
.mc-more{grid-area:more;align-self:end;width:44px;height:44px;border:0;background:none;color:var(--ink-2);display:grid;place-items:center;border-radius:8px}
.mc-more[aria-expanded="true"] svg{transform:rotate(180deg)}
.mc-det{grid-area:det;margin:6px 4px 4px 10px;padding-top:9px;border-top:1px dashed var(--rule)}
.mc-dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin:0}
.mc-dl div{min-width:0} .mc-dl .full{grid-column:1/-1}
.mc-dl dd{margin:3px 0 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font:600 14px "IBM Plex Mono",monospace;color:var(--ink-2)}
.mc-full{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:44px;margin-top:10px;border-radius:9px;border:1px solid rgba(0,207,255,.45);background:var(--accent-soft);color:var(--accent);font:700 14px "IBM Plex Sans",sans-serif}
.chartmini{display:inline-flex;align-items:center;gap:6px;font:700 14px "IBM Plex Mono",monospace}
.cdot{width:8px;height:8px;border-radius:50%;background:currentColor}
.m-pickbar{position:absolute;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:8px 12px;
  background:var(--surface-2);border-top:1.5px solid rgba(0,207,255,.55);box-shadow:0 -14px 30px -12px rgba(0,0,0,.85)}
.m-pickbar .pb-label{font:700 12.5px/1.25 "IBM Plex Sans",sans-serif;color:var(--ink)}
.m-pickbar .pb-clear{height:44px;padding:0 4px;border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12.5px}
.m-pickbar .pb-launch{display:flex;align-items:center;height:44px;padding:0 12px;border-radius:8px;background:var(--accent);color:#04121c;font:700 13px "IBM Plex Sans",sans-serif;white-space:nowrap}
.yr{margin:0 0 10px;padding:10px 12px 6px;background:var(--surface);border:1px solid var(--rule);border-radius:12px}
.yr .hc-sub{font-size:11px;margin:0 0 6px}
.yr-hint{font:500 11px "IBM Plex Mono",monospace;color:var(--accent-ink);margin:2px 0 6px}
.ranklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;background:var(--rule-soft);border:1px solid var(--rule-soft);border-radius:8px;overflow:hidden}
.rank-row{display:grid;grid-template-columns:14px 1fr auto auto;align-items:center;gap:9px;padding:0 12px;min-height:44px;background:var(--surface-2)}
.rank-row.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.rank-row .rk{width:9px;height:9px;border-radius:2px}
.rank-row .nmw{display:flex;align-items:center;gap:7px;min-width:0}
.rank-row .lbl{font:600 13px "IBM Plex Sans",sans-serif;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-row .val{font:700 12.5px "IBM Plex Mono",monospace} .rank-row .val.up{color:var(--gem)} .rank-row .val.down{color:var(--bad)}
.rl-open{font:700 12px "IBM Plex Sans",sans-serif;color:var(--accent)}
.b-rank-list .rank-row{min-height:33px;grid-template-columns:14px 1fr auto}
.tipcard{position:absolute;z-index:40;background:var(--surface);color:var(--ink-2);padding:11px 13px;border-radius:12px;border:1px solid rgba(0,150,255,.35);box-shadow:0 10px 30px rgba(0,0,0,.6);font-size:13.5px;line-height:1.45}
.tipcard b{color:var(--ink);font-size:14.5px}
.tipcard.dock{left:8px;right:8px;bottom:8px;border-color:rgba(0,207,255,.55);box-shadow:0 -12px 30px rgba(0,0,0,.7)}
.tip-open{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:44px;margin-top:9px;border-radius:9px;border:0;background:var(--accent);color:#04121c;font:700 14px "IBM Plex Sans",sans-serif}
.tip-hint{display:block;margin-top:6px;font:500 11px "IBM Plex Mono",monospace;color:var(--muted);text-align:center}
.scrim{position:absolute;inset:0;z-index:35;background:rgba(3,6,12,.66)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:36;background:var(--surface);border-top:1.5px solid rgba(0,207,255,.5);border-radius:18px 18px 0 0;padding:6px 16px 0;box-shadow:0 -20px 40px rgba(0,0,0,.6)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--rule);margin:2px auto 4px;background:#2b3a50}
.sh-top{display:flex;align-items:center;justify-content:space-between;height:44px}
.sh-top b{font:700 17px "IBM Plex Sans",sans-serif;color:var(--text-heading)}
.sh-done{height:44px;padding:0 16px;border-radius:9px;border:0;background:var(--accent);color:#04121c;font:700 14px "IBM Plex Sans",sans-serif}
.sh-h{display:block;font:600 10.5px "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.sh-floor{display:flex;align-items:center;gap:12px;height:44px}
.sh-floor .segs{flex:1;width:auto} .sh-floor .segs i{height:10px}
.sh-sort{display:flex;align-items:center;justify-content:space-between}
.seg2{display:inline-flex;background:var(--surface-sunk);border-radius:8px;padding:2px;gap:2px}
.seg2 span{display:flex;align-items:center;height:40px;padding:0 11px;border-radius:7px;font:600 12.5px "IBM Plex Mono",monospace;color:var(--muted)}
.seg2 span.on{background:var(--surface-2);color:var(--accent);box-shadow:var(--shadow)}
.radios{list-style:none;margin:0;padding:0;border:1px solid var(--rule-soft);border-radius:10px;overflow:hidden}
.radios li{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-bottom:1px solid var(--rule-soft);font:500 14.5px "IBM Plex Sans",sans-serif;color:var(--ink)}
.radios li:last-child{border-bottom:0}
.radios .rd{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);flex:none}
.radios li.on{background:var(--accent-soft)} .radios li.on .rd{border:5px solid var(--accent)}
.radios .rd-note{margin-left:auto;font:500 11px "IBM Plex Mono",monospace;color:var(--muted)}
.m-alt{display:flex;align-items:center;gap:10px;height:52px;padding:0 12px;margin-bottom:8px;border-radius:12px;border:1.5px solid rgba(0,207,255,.45);background:var(--surface)}
.m-alt .k{font:600 10px "IBM Plex Mono",monospace;letter-spacing:.14em;color:var(--ink-2)}
.m-alt .v{font:700 20px "IBM Plex Mono",monospace;color:var(--ink)} .m-alt .v small{font-size:12px;color:var(--muted);font-weight:500}
.m-alt .w{font:600 13px "IBM Plex Sans",sans-serif;color:var(--ink)}
.m-alt .chev{margin-left:auto;color:var(--accent)}
.sgroup{display:flex;align-items:center;gap:8px;margin:12px 0 6px;font:700 12px "IBM Plex Mono",monospace;letter-spacing:.1em}
.sgroup .n{font-weight:600;color:var(--ink-2);border:1px solid var(--rule);border-radius:99px;padding:0 7px;letter-spacing:0}
.sgroup .r{font:500 11px "IBM Plex Sans",sans-serif;letter-spacing:0;color:var(--muted)}
.scards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.scard{--st:var(--good);position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name stage" "nums nums";gap:6px 8px;padding:10px 10px 8px 14px;background:var(--surface);border:1px solid var(--rule-soft);border-radius:12px}
.scard::before{content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--st);opacity:.8}
.scard.st-emerging{--st:var(--accent)} .scard.st-fading{--st:var(--warn)} .scard.st-falling{--st:var(--bad)}
.sc-name{grid-area:name;min-width:0}
.logostack{display:inline-flex} .logostack .ico-fb{width:22px;height:22px;font-size:8px;margin-left:-6px;border-color:var(--surface)} .logostack .ico-fb:first-child{margin-left:0}
.sc-stage{grid-area:stage;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.sc-stage .was{font:500 10.5px "IBM Plex Mono",monospace;color:var(--muted)}
.sc-nums{grid-area:nums;display:grid;grid-template-columns:1fr 1fr 1.45fr;border-top:1px solid var(--rule-soft);padding-top:6px}
.sc-nums .mc-v{font-size:15px}
.sc-nums .g2{font:600 11.5px "IBM Plex Mono",monospace}
.legend-note{font:500 11px "IBM Plex Mono",monospace;color:var(--muted)}
</style>
