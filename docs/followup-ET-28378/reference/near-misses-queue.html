<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Near Misses Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
/* Layout: one card. Title + one line on top, then a single lane: the green "Picks" gate on the left, a moving dashed rail, and small cubes standing in line (closest to the gate first). The lane scrolls sideways if the queue is longer than the card. Dark-only, same palette as the Gem Screener. */
:root {
  --bg: #0a0e17;
  --bg-2: #0d1520;
  --bg-3: #111a28;
  --card: #0d1520;
  --line: rgba(0, 150, 255, .15);
  --line-2: rgba(0, 150, 255, .34);
  --fg: #e6edf7;
  --fg-2: #a9b8cc;
  --muted: #7188a3;
  --accent: #00cfff;
  --green: #00ff88;
  --green-glow: rgba(0, 255, 136, .35);
  --blue: #38bdf8;
  --blue-bg: rgba(56, 189, 248, .11);
  --font-display: "Archivo Black", "Arial Black", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
}
h2, p { margin: 0; }
.wrap { max-width: 940px; margin: 0 auto; padding: 32px 16px 72px; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; min-width: 0; overflow: hidden; }

.head { padding: 18px 20px 4px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 18px; }
h2 { font-size: 18px; font-weight: 700; letter-spacing: -.005em; }
.why { font: 500 12.5px var(--font-mono); color: var(--muted); }
.why b { color: var(--fg-2); font-weight: 600; }
.sub { padding: 0 20px 6px; font-size: 14px; color: var(--fg-2); }

/* lane */
.lane { position: relative; overflow-x: auto; overflow-y: hidden; padding: 14px 16px 18px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.lane.more { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 44px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 44px), transparent); }
.track { position: relative; display: flex; align-items: stretch; gap: 8px; width: max-content; min-width: 100%; }
/* the rail runs behind the cubes and flows toward the gate */
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: repeating-linear-gradient(90deg, rgba(0, 207, 255, .55) 0 7px, transparent 7px 15px); animation: flow 1.6s linear infinite; }
@keyframes flow { to { background-position: -15px 0; } }

.gate { position: sticky; left: 0; z-index: 3; flex: 0 0 66px; display: grid; align-content: center; justify-items: center; gap: 8px; border-radius: 14px; color: var(--green); background: linear-gradient(180deg, #0f2d27, #0b2120); border: 1px solid rgba(0, 255, 136, .55); box-shadow: 0 0 26px rgba(0, 255, 136, .2), inset 0 0 18px rgba(0, 255, 136, .08); }
.gate svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 6px var(--green-glow)); }
.gate span { font: 600 11.5px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; }

.cube { position: relative; z-index: 1; flex: 0 0 124px; min-height: 126px; display: flex; flex-direction: column; gap: 2px; padding: 10px 11px 11px; border-radius: 14px; background: linear-gradient(180deg, #111e30, #0b1524); border: 1px solid var(--line); border-bottom: 3px solid rgba(56, 189, 248, .6); color: inherit; text-decoration: none; transition: transform .15s, border-color .15s, box-shadow .15s; animation: arrive .55s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 70ms); }
.cube:hover, .cube:focus-visible { transform: translateY(-3px); border-color: var(--line-2); border-bottom-color: var(--blue); box-shadow: 0 10px 24px rgba(0, 0, 0, .4); }
.cube:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.ready .cube { animation: none; }
@keyframes arrive { from { opacity: 0; transform: translateX(34px); } }
.nm { font-size: 14px; font-weight: 600; line-height: 1.2; min-height: 2.4em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.mx { display: flex; align-items: baseline; justify-content: space-between; margin: 2px 0 6px; }
.x { font: 400 30px/1 var(--font-display); color: var(--green); text-shadow: 0 0 18px var(--green-glow); }
.pos { font: 500 11.5px var(--font-mono); color: var(--muted); }
.re { margin-top: auto; display: flex; gap: 6px; align-items: flex-start; padding: 5px 7px; border-radius: 8px; background: var(--blue-bg); border: 1px solid rgba(56, 189, 248, .28); color: var(--blue); font: 500 12px/1.2 var(--font-body); height: 40px; align-items: center; }
.re svg { width: 14px; height: 14px; flex: none; margin-top: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.note { font-size: 13px; color: var(--muted); padding: 0 4px; }
#tip { position: fixed; left: 0; top: 0; z-index: 50; max-width: 280px; padding: 9px 12px; border-radius: 10px; background: #0a1220; border: 1px solid var(--line-2); box-shadow: 0 14px 34px rgba(0, 0, 0, .55); color: var(--fg); font-size: 13.5px; line-height: 1.45; white-space: pre-line; pointer-events: none; opacity: 0; transition: opacity .12s; }

@media (max-width: 560px) {
  .head { padding: 16px 16px 2px; }
  .sub { padding: 0 16px 4px; }
  .lane { padding: 12px 12px 16px; }
  .cube { flex-basis: 118px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <section class="card" aria-labelledby="h">
    <header class="head">
      <h2 id="h">Near misses</h2>
      <p class="why" id="why"></p>
    </header>
    <p class="sub">Held back by one thing. Waiting in line for Picks, biggest upside first.</p>
    <div class="lane" id="lane">
      <div class="track" id="track" role="list">
        <div class="gate" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 21V4.5A1.5 1.5 0 0 1 6.5 3h11A1.5 1.5 0 0 1 19 4.5V21"/><path d="M3 21h18"/><path d="M14 12.5v.01"/></svg>
          <span>Picks</span>
        </div>
      </div>
    </div>
  </section>
  <p class="note">Mock: the same six coins as on the live page today.</p>
</div>
<div id="tip" role="tooltip"></div>
<script>
(function () {
  'use strict';
  const COINS = [
    { name: 'RamsesX', x: 31, why: 'liq' },
    { name: 'Collector Crypt', x: 25, why: 'growth' },
    { name: 'Pons', x: 15, why: 'big' },
    { name: 'Rainbow', x: 14, why: 'liq' },
    { name: 'Gains Network', x: 11, why: 'liq' },
    { name: 'Saphyre', x: 10, why: 'liq' }
  ];
  const WHY = {
    liq: { label: 'thin liquidity', d: 'M12 3c3 4 6 7 6 10a6 6 0 0 1-12 0c0-3 3-6 6-10z' },
    growth: { label: 'business not growing', short: 'not growing', d: 'M4 12h15M14 7l5 5-5 5' },
    big: { label: 'too big', d: 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5' }
  };
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const track = document.getElementById('track');
  const lane = document.getElementById('lane');

  COINS.forEach((c, i) => {
    const w = WHY[c.why];
    const a = el('a', 'cube');
    a.href = '#'; a.setAttribute('role', 'listitem');
    a.style.setProperty('--i', i);
    a.dataset.tip = c.name + ' · ' + c.x + 'x\nHeld back by: ' + w.label + '.\n#' + (i + 1) + ' in line.';
    a.addEventListener('click', e => e.preventDefault());
    a.appendChild(el('div', 'nm', c.name));
    const mx = el('div', 'mx');
    mx.appendChild(el('span', 'x', c.x + 'x'));
    mx.appendChild(el('span', 'pos', '#' + (i + 1)));
    a.appendChild(mx);
    const re = el('div', 're');
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24'); svg.setAttribute('aria-hidden', 'true');
    const p = document.createElementNS(NS, 'path'); p.setAttribute('d', w.d); svg.appendChild(p);
    re.appendChild(svg);
    re.appendChild(el('span', null, w.short || w.label));
    a.appendChild(re);
    track.appendChild(a);
  });

  // one line above the lane: why most of them wait
  const counts = {};
  COINS.forEach(c => { counts[c.why] = (counts[c.why] || 0) + 1; });
  const why = document.getElementById('why');
  Object.keys(counts).sort((p, q) => counts[q] - counts[p]).forEach((k, i) => {
    if (i) why.appendChild(document.createTextNode(' · '));
    why.appendChild(el('b', null, String(counts[k])));
    why.appendChild(document.createTextNode(' ' + WHY[k].label));
  });

  // fade the right edge only while there is more to scroll
  const more = () => lane.classList.toggle('more', lane.scrollWidth - lane.clientWidth - lane.scrollLeft > 4);
  lane.addEventListener('scroll', more, { passive: true });
  addEventListener('resize', more);
  more();
  setTimeout(() => document.documentElement.classList.add('ready'), 1400);

  // tooltip
  const tip = document.getElementById('tip');
  let cur = null;
  function show(t) {
    if (cur === t) return;
    cur = t; tip.textContent = t.dataset.tip; tip.style.opacity = '1';
    const r = t.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.min(Math.max(8, r.left + r.width / 2 - tw / 2), innerWidth - tw - 8) + 'px';
    let y = r.bottom + 10; if (y + th > innerHeight - 8) y = r.top - th - 10;
    tip.style.top = Math.max(8, y) + 'px';
  }
  const hide = () => { cur = null; tip.style.opacity = '0'; };
  document.addEventListener('mouseover', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) show(t); else hide(); });
  document.addEventListener('focusin', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) show(t); });
  document.addEventListener('focusout', hide);
  addEventListener('scroll', hide, true);
})();
</script>
</body>
</html>
