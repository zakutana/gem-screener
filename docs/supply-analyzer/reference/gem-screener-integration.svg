<text x="26" y="315" font-size="11" fill="#6f8199" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">A dashed ring and a dash where it is unknown. Sortable by the number. Only Hyperliquid's pie is a real reading; the others show the look.</text>
